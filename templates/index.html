<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0f172a"/>
<title>Ryder Cup 🏌️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --eu:#3b82f6;--eu-bg:#1d3a6e;--eu-t:#93c5fd;
  --usa:#ef4444;--usa-bg:#5a1a1a;--usa-t:#fca5a5;
  --bg:#0f172a;--sf:#1e293b;--sf2:#334155;--tx:#f1f5f9;--mt:#94a3b8;--br:#334155;
  --gn:#22c55e;--am:#f59e0b;--r:12px;
}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100dvh}

/* LOGIN */
#login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:20px}
.logo{font-size:52px;margin-bottom:6px}
.login-title{font-size:22px;font-weight:700;margin-bottom:2px}
.login-sub{font-size:13px;color:var(--mt);margin-bottom:28px;text-align:center}
.login-box{background:var(--sf);border-radius:var(--r);padding:18px;width:100%;max-width:380px}
.section-lbl{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mt);margin-bottom:8px}
.plist{display:flex;flex-direction:column;gap:5px;max-height:320px;overflow-y:auto;margin-bottom:14px}
.pbtn{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;border:1px solid var(--br);background:none;color:var(--tx);font-size:13px;text-align:left;cursor:pointer;width:100%}
.pbtn:active{background:var(--sf2)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ptag{font-size:11px;color:var(--mt);margin-left:auto;flex-shrink:0}
.adiv{border-top:1px solid var(--br);padding-top:12px}
.adiv p{font-size:12px;color:var(--mt);margin-bottom:8px}
.arow{display:flex;gap:8px}
.ainp{flex:1;background:var(--sf2);border:1px solid var(--br);border-radius:8px;padding:9px 12px;font-size:14px;color:var(--tx);outline:none}
.abtn{padding:9px 14px;border-radius:8px;border:none;background:var(--am);color:#000;font-size:13px;font-weight:600;cursor:pointer}

/* APP */
#app{display:none}
.nav{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.nav-l{display:flex;align-items:center;gap:8px}
.ntitle{font-size:14px;font-weight:600}
.ldot{width:8px;height:8px;border-radius:50%;background:var(--gn);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.wbadge{font-size:11px;padding:3px 8px;border-radius:99px;font-weight:600}
.wb-eu{background:var(--eu-bg);color:var(--eu-t)}
.wb-usa{background:var(--usa-bg);color:var(--usa-t)}
.wb-admin{background:#451a03;color:var(--am)}
.nbtn{font-size:11px;color:var(--mt);background:none;border:1px solid var(--br);border-radius:8px;padding:4px 8px;cursor:pointer}

/* SCOREBOARD */
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:16px 14px 8px}
.tblock{text-align:center}
.tlbl{font-size:11px;font-weight:700;letter-spacing:.08em;margin-bottom:2px}
.tpts{font-size:48px;font-weight:700;line-height:1}
.eu-c{color:var(--eu)}.usa-c{color:var(--usa)}
.vs{font-size:16px;color:var(--br);font-weight:600}
.lbar{margin:0 14px 14px;height:5px;border-radius:99px;background:var(--sf2);overflow:hidden}
.lfill{height:100%;border-radius:99px;transition:width .5s;background:var(--eu)}

/* TABS */
.tabs{display:flex;padding:0 14px 10px;gap:6px;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:6px 14px;border-radius:99px;font-size:13px;font-weight:500;border:1px solid var(--br);background:none;color:var(--mt);cursor:pointer}
.tab.on{background:var(--sf2);color:var(--tx);border-color:transparent}
.sec{display:none;padding:0 14px 80px}
.sec.on{display:block}

/* OVERVIEW */
.mcard{background:var(--sf);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;cursor:pointer;border:1px solid transparent}
.mcard.mine-eu{border-color:var(--eu)}
.mcard.mine-usa{border-color:var(--usa)}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mlbl{font-size:13px;font-weight:600}
.mscore{font-size:22px;font-weight:700}
.mplayers{font-size:11px;color:var(--mt);display:flex;justify-content:space-between;gap:4px;margin-bottom:6px}
.pbar{height:4px;border-radius:99px;background:var(--sf2);overflow:hidden}
.pbarfill{height:100%;border-radius:99px;background:var(--eu);transition:width .3s}

/* ENTRADA */
.msel{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.mselbtn{flex:1;min-width:55px;padding:6px 4px;border-radius:8px;border:1px solid var(--br);background:none;font-size:12px;font-weight:500;color:var(--mt);cursor:pointer;text-align:center}
.mselbtn.on{background:var(--sf2);color:var(--tx);border-color:var(--eu)}
.mselbtn:disabled{opacity:.3;cursor:not-allowed}
.hgrid{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin-bottom:12px}
.hb{aspect-ratio:1;border-radius:7px;border:1px solid var(--br);background:none;font-size:12px;font-weight:500;color:var(--mt);cursor:pointer}
.hb.done{background:var(--sf2);color:var(--tx)}
.hb.sel{background:var(--eu);color:#fff;border-color:transparent}
.hb.eu-w{background:var(--eu-bg);color:var(--eu-t)}
.hb.usa-w{background:var(--usa-bg);color:var(--usa-t)}
.card{background:var(--sf);border-radius:var(--r);padding:14px;margin-bottom:10px}
.ctitle{font-size:12px;font-weight:700;color:var(--mt);letter-spacing:.05em;margin-bottom:10px}
.prow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pstep{display:flex;align-items:center;gap:8px}
.pbtn2{width:30px;height:30px;border-radius:8px;background:var(--sf2);border:none;color:var(--tx);font-size:16px;cursor:pointer}
.pv{font-size:15px;font-weight:600;min-width:18px;text-align:center}
.hinfo{font-size:11px;color:var(--am);background:#451a03;border-radius:6px;padding:4px 8px;margin-bottom:10px}
.tsec{font-size:11px;font-weight:700;letter-spacing:.06em;margin:10px 0 7px}
.erow{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.ename{font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbadge{font-size:10px;color:var(--am);background:#451a03;padding:2px 5px;border-radius:4px;flex-shrink:0}
.sinp{width:58px;background:var(--sf2);border:1px solid var(--br);border-radius:8px;padding:7px;font-size:16px;font-weight:600;color:var(--tx);text-align:center;outline:none;-moz-appearance:textfield}
.sinp::-webkit-inner-spin-button{display:none}
.sinp:disabled{opacity:.4}
.net{font-size:11px;color:var(--mt);min-width:36px;text-align:right}
.net.ok{color:var(--gn)}
.savebtn{width:100%;padding:12px;border-radius:var(--r);background:var(--gn);color:#fff;font-size:14px;font-weight:600;border:none;cursor:pointer;margin-top:6px}

/* TABLE */
.stbl{width:100%;border-collapse:collapse;font-size:12px}
.stbl th{padding:5px 3px;color:var(--mt);font-weight:500;text-align:center;border-bottom:1px solid var(--br)}
.stbl td{padding:6px 3px;text-align:center;border-bottom:1px solid var(--br)}
.stbl tr:last-child td{border-bottom:none}
.hn{color:var(--mt);font-weight:500}
.bdg{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:99px}
.b-eu{background:var(--eu-bg);color:var(--eu-t)}
.b-usa{background:var(--usa-bg);color:var(--usa-t)}
.b-draw{background:var(--sf2);color:var(--mt)}

.offline{display:none;position:fixed;top:0;left:0;right:0;text-align:center;font-size:12px;padding:4px;background:#b91c1c;color:#fff;z-index:200}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--sf2);color:var(--tx);padding:9px 18px;border-radius:99px;font-size:13px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:100}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="offline" id="offline">Sin conexión — reconectando…</div>

<!-- LOGIN -->
<div id="login">
  <div class="logo">🏌️</div>
  <div class="login-title">Ryder Cup</div>
  <div class="login-sub">Golf Las Pinaillas 2026<br>¿Quién eres?</div>
  <div class="login-box">
    <div class="section-lbl">JUGADORES</div>
    <div class="plist" id="plist"></div>
    <div class="adiv">
      <p>🔑 Acceso admin</p>
      <div class="arow">
        <input class="ainp" id="apw" type="password" placeholder="Contraseña"/>
        <button class="abtn" onclick="loginAdmin()">Entrar</button>
      </div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <nav class="nav">
    <div class="nav-l">
      <div class="ldot" id="ldot"></div>
      <span class="ntitle">Ryder Cup · Las Pinaillas</span>
      <span class="wbadge" id="wbadge"></span>
    </div>
    <div style="display:flex;gap:6px">
      <button class="nbtn" onclick="logout()">Cambiar</button>
      <button class="nbtn" id="resetbtn" style="display:none" onclick="doReset()">Reset</button>
    </div>
  </nav>

  <div class="sb">
    <div class="tblock"><div class="tlbl eu-c">EUROPA</div><div class="tpts eu-c" id="eu-t">0</div></div>
    <div class="vs">–</div>
    <div class="tblock"><div class="tlbl usa-c">USA</div><div class="tpts usa-c" id="usa-t">0</div></div>
  </div>
  <div class="lbar"><div class="lfill" id="lfill" style="width:50%"></div></div>

  <div class="tabs">
    <button class="tab on" onclick="showTab('overview')">🏆 General</button>
    <button class="tab" onclick="showTab('entrada')">✏️ Anotar</button>
    <button class="tab" onclick="showTab('tarjeta')">📋 Tarjeta</button>
  </div>

  <div id="t-overview" class="sec on"><div id="mcards"></div></div>

  <div id="t-entrada" class="sec">
    <div class="msel" id="msel"></div>
    <div class="hgrid" id="hgrid"></div>
    <div class="card">
      <div class="ctitle">HOYO <span id="hlbl">1</span> · PAR <span id="parlbl">4</span></div>
      <div class="prow">
        <span style="font-size:13px;color:var(--mt)">Par</span>
        <div class="pstep">
          <button class="pbtn2" onclick="chPar(-1)">−</button>
          <span class="pv" id="parv">4</span>
          <button class="pbtn2" onclick="chPar(1)">+</button>
        </div>
      </div>
      <div class="hinfo" id="hinfo"></div>
      <div class="tsec eu-c">EUROPA</div>
      <div id="eu-entry"></div>
      <div class="tsec usa-c">USA</div>
      <div id="usa-entry"></div>
      <button class="savebtn" onclick="saveHole()">💾 Guardar hoyo</button>
    </div>
  </div>

  <div id="t-tarjeta" class="sec">
    <div class="msel" id="msel2"></div>
    <div style="overflow-x:auto">
      <table class="stbl">
        <thead><tr>
          <th>H</th><th>Par</th>
          <th style="color:var(--eu)">EU</th><th style="color:var(--usa)">USA</th>
          <th>Mejor</th><th>Peor</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SI=[5,11,17,3,7,1,15,13,9,4,16,8,10,14,6,18,12,2];
let S=null,me=null,admin=false,sm=0,sh=0,sm2=0,cpar=4,ws=null,wsr=0;

function gh(hcp,hi){const si=SI[hi],b=Math.floor(hcp/18),r=hcp%18;return b+(si<=r?1:0);}

// ── Init ──────────────────────────────────────────────────────────────────────
(async()=>{
  const d=await fetch('/api/state').then(r=>r.json());
  S=d; buildLogin(); connectWS();
})();

function buildLogin(){
  if(!S)return;
  const ul=document.getElementById('plist'); ul.innerHTML='';
  Object.entries(S.players).forEach(([name,info])=>{
    const mid=S.pm[name], ml=S.matches.find(m=>m.id===mid);
    const b=document.createElement('button');
    b.className='pbtn';
    b.innerHTML=`<span class="dot" style="background:${info.team==='eu'?'var(--eu)':'var(--usa)'}"></span>
      <span>${name}</span><span class="ptag">P${mid+1}</span>`;
    b.onclick=()=>loginAs(name,info.team,mid);
    ul.appendChild(b);
  });
}

function loginAs(name,team,mid){
  me=name; admin=false; sm=mid; sh=0;
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  const b=document.getElementById('wbadge');
  b.textContent=name.split(' ')[0]; b.className='wbadge wb-'+team;
  document.getElementById('resetbtn').style.display='none';
  renderAll();
}

async function loginAdmin(){
  const pw=document.getElementById('apw').value;
  const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
  if(r.ok){
    me='Admin'; admin=true; sm=0; sh=0;
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='block';
    const b=document.getElementById('wbadge');
    b.textContent='⚙️ Admin'; b.className='wbadge wb-admin';
    document.getElementById('resetbtn').style.display='block';
    renderAll();
  } else toast('Contraseña incorrecta');
}

function logout(){
  document.getElementById('login').style.display='flex';
  document.getElementById('app').style.display='none';
  me=null; admin=false;
}

// ── WebSocket ─────────────────────────────────────────────────────────────────
function connectWS(){
  const p=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${p}://${location.host}/ws`);
  ws.onopen=()=>{wsr=0;document.getElementById('offline').style.display='none';document.getElementById('ldot').style.background='#22c55e'};
  ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='state'){S=m.data;if(me)renderAll();}};
  ws.onclose=()=>{document.getElementById('offline').style.display='block';document.getElementById('ldot').style.background='#ef4444';setTimeout(connectWS,Math.min(1000*2**wsr,16000));wsr++;};
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderAll(){
  rSB(); rOverview(); rMsel(); rHgrid(); rForm(); rTable();
}

function rSB(){
  if(!S)return;
  document.getElementById('eu-t').textContent=S.total_eu;
  document.getElementById('usa-t').textContent=S.total_usa;
  const tot=S.total_eu+S.total_usa, pct=tot?Math.round(S.total_eu/tot*100):50;
  const f=document.getElementById('lfill');
  f.style.width=pct+'%'; f.style.background=pct>=50?'var(--eu)':'var(--usa)';
}

function rOverview(){
  if(!S)return;
  const myMid=admin?-1:S.pm[me];
  const div=document.getElementById('mcards'); div.innerHTML='';
  S.matches.forEach((m,i)=>{
    const pts=S.match_pts[i], done=m.holes.filter(h=>h.done).length;
    const isMine=m.id===myMid;
    const myT=isMine?(m.eu.includes(me)?'eu':'usa'):null;
    const ec=pts.eu>pts.usa?'var(--eu)':'var(--mt)';
    const uc=pts.usa>pts.eu?'var(--usa)':'var(--mt)';
    div.innerHTML+=`<div class="mcard${isMine?' mine-'+myT:''}" onclick="goMatch(${i})">
      <div class="mhead">
        <span class="mlbl">${m.label}${isMine?' <span style="font-size:10px;color:var(--am)">⭐ Tu partida</span>':''}</span>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="mscore" style="color:${ec}">${pts.eu}</span>
          <span style="color:var(--br);font-size:14px">–</span>
          <span class="mscore" style="color:${uc}">${pts.usa}</span>
        </div>
      </div>
      <div class="mplayers">
        <span style="color:var(--eu-t)">${m.eu.join(' · ')}</span>
        <span style="color:var(--usa-t);text-align:right">${m.usa.join(' · ')}</span>
      </div>
      <div class="pbar"><div class="pbarfill" style="width:${done/18*100}%"></div></div>
    </div>`;
  });
}

function goMatch(i){
  const myMid=admin?-1:S.pm[me];
  if(!admin&&S.matches[i].id!==myMid){toast('Solo puedes anotar en tu partida');return;}
  sm=i; sh=0; showTab('entrada');
}

function rMsel(){
  ['msel','msel2'].forEach((id,ti)=>{
    const div=document.getElementById(id); if(!div||!S)return;
    div.innerHTML='';
    const myMid=admin?-1:S.pm[me];
    S.matches.forEach((m,i)=>{
      const sel=ti===0?sm:sm2;
      const btn=document.createElement('button');
      btn.className='mselbtn'+(i===sel?' on':'');
      btn.textContent='P'+(i+1);
      if(!admin&&ti===0&&m.id!==myMid) btn.disabled=true;
      btn.onclick=()=>{
        if(!admin&&ti===0&&m.id!==myMid){toast('Solo puedes anotar en tu partida');return;}
        if(ti===0){sm=i;sh=0;rMsel();rHgrid();rForm();}
        else{sm2=i;rMsel();rTable();}
      };
      div.appendChild(btn);
    });
  });
}

function rHgrid(){
  const g=document.getElementById('hgrid'); if(!g||!S)return;
  g.innerHTML='';
  const m=S.matches[sm];
  for(let i=0;i<18;i++){
    const h=m.holes[i];
    const b=document.createElement('button');
    let c='hb'+(i===sh?' sel':h.done?' done':'');
    if(h.done&&i!==sh){const e=h.pts_eu_m+h.pts_eu_p,u=h.pts_usa_m+h.pts_usa_p;if(e>u)c+=' eu-w';else if(u>e)c+=' usa-w';}
    b.className=c; b.textContent=i+1;
    b.onclick=()=>{sh=i;rHgrid();rForm();};
    g.appendChild(b);
  }
}

function rForm(){
  if(!S)return;
  const m=S.matches[sm], h=m.holes[sh], par=S.par[sh];
  cpar=par;
  document.getElementById('hlbl').textContent=sh+1;
  document.getElementById('parlbl').textContent=par;
  document.getElementById('parv').textContent=par;
  document.getElementById('hinfo').textContent=`Índice dificultad: ${SI[sh]} · hcp ≥ ${SI[sh]} recibe +1 golpe`;
  const myMid=admin?-1:S.pm[me];
  const canEdit=admin||m.id===myMid;
  ['eu','usa'].forEach(team=>{
    const div=document.getElementById(team+'-entry'); div.innerHTML='';
    m[team].forEach(name=>{
      const hcp=S.players[name]?.hcp??0, ex=gh(hcp,sh);
      const sc=h.scores[name]??'';
      const net=sc!==''?(sc-ex):'';
      const k=name.replace(/[^a-zA-Z0-9]/g,'_');
      div.innerHTML+=`<div class="erow">
        <span class="ename">${name}</span>
        <span class="hbadge">+${ex}</span>
        <input class="sinp" id="s_${k}" type="number" min="1" max="20" inputmode="numeric" value="${sc}" placeholder="—" ${canEdit?'':'disabled'} oninput="upNet('${k}',${ex},${par})"/>
        <span class="net${net!==''&&net<=par?' ok':''}" id="n_${k}">${net!==''?'neto: '+net:''}</span>
      </div>`;
    });
  });
}

function upNet(k,ex,par){
  const v=parseInt(document.getElementById('s_'+k)?.value);
  const el=document.getElementById('n_'+k); if(!el)return;
  if(isNaN(v)){el.textContent='';el.className='net';return;}
  el.textContent='neto: '+(v-ex);
  el.className='net'+(v-ex<=par?' ok':'');
}

function chPar(d){
  cpar=Math.min(5,Math.max(3,cpar+d));
  document.getElementById('parv').textContent=cpar;
  document.getElementById('parlbl').textContent=cpar;
}

async function saveHole(){
  const m=S.matches[sm], all=[...m.eu,...m.usa]; let saved=0;
  for(const name of all){
    const k=name.replace(/[^a-zA-Z0-9]/g,'_');
    const inp=document.getElementById('s_'+k);
    if(!inp||inp.disabled)continue;
    const v=parseInt(inp.value);
    const r=await fetch('/api/score',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({match_id:sm,hole:sh,player:name,score:isNaN(v)?null:v})});
    if(!isNaN(v)&&r.ok)saved++;
  }
  if(saved>0){toast(`Hoyo ${sh+1} guardado ✓`);if(sh<17){sh++;rHgrid();rForm();}}
  else toast('Introduce al menos un golpe');
}

function rTable(){
  if(!S)return;
  const m=S.matches[sm2], tb=document.getElementById('tbody'); tb.innerHTML='';
  m.holes.forEach((h,i)=>{
    const par=S.par[i], tr=document.createElement('tr');
    if(!h.done){
      tr.innerHTML=`<td class="hn">${i+1}</td><td>${par}</td><td colspan="2" style="color:var(--br)">—</td><td>·</td><td>·</td>`;
    } else {
      const mb=h.pts_eu_m>h.pts_usa_m?'<span class="bdg b-eu">EU+2</span>':h.pts_usa_m>h.pts_eu_m?'<span class="bdg b-usa">USA+2</span>':'<span class="bdg b-draw">–</span>';
      const pb=h.pts_eu_p>h.pts_usa_p?'<span class="bdg b-eu">EU+1</span>':h.pts_usa_p>h.pts_eu_p?'<span class="bdg b-usa">USA+1</span>':'<span class="bdg b-draw">–</span>';
      tr.innerHTML=`<td class="hn">${i+1}</td><td>${par}</td>
        <td style="color:var(--eu);font-weight:600">${h.eu_best}<small style="color:var(--br)">(${h.eu_worst})</small></td>
        <td style="color:var(--usa);font-weight:600">${h.usa_best}<small style="color:var(--br)">(${h.usa_worst})</small></td>
        <td>${mb}</td><td>${pb}</td>`;
    }
    tb.appendChild(tr);
  });
}

function showTab(name){
  ['overview','entrada','tarjeta'].forEach(t=>{
    document.getElementById('t-'+t).classList.toggle('on',t===name);
  });
  document.querySelectorAll('.tab').forEach((b,i)=>{
    b.classList.toggle('on',['overview','entrada','tarjeta'][i]===name);
  });
  if(name==='entrada'){rMsel();rHgrid();rForm();}
  if(name==='tarjeta'){rMsel();rTable();}
}

async function doReset(){
  if(!confirm('¿Reiniciar toda la partida?'))return;
  await fetch('/api/reset',{method:'POST'});
  toast('Partida reiniciada');
}

let tt;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('on');
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('on'),2500);
}
</script>
